services:
  db:
    image: postgres:16-alpine
    container_name: camcalorie-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: camcalorie
      POSTGRES_USER: camcalorie
      POSTGRES_PASSWORD: Pp8110Camcalorie
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camcalorie"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: